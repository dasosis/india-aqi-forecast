[project]
name = "india-aqi-forecast"
version = "0.1.0"
description = "AQI forecasting for Indian cities, built to learn MLOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_forecast"]
