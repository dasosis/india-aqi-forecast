[project]
name = "india-aqi-forecast"
version = "0.1.0"
description = "AQI forecasting for Indian cities, built to learn MLOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_forecast"]
